<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assignment.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div class="container">
        <input id="display" type="text" placeholder="0">
        <div>
            <button id="reset" onclick="clearData()">C</button>
            <button id="erase" onclick="erase()"><i class="fa-solid fa-delete-left"></i></button>
            <button id="divide" onclick="appendValue('/')">/</button>
            <button onclick="appendValue('%')">%</button>
        </div>
        <div>
            <button onclick="appendValue('7')">7</button> 
            <!-- value of variable -->
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">*</button>
        </div>
        <div>
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">-</button>
        </div>
        <div>
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>
        </div>
        <div>
            <!-- <button>+/-</button> -->
            <button onclick="appendValue('.')">.</button>
            <button onclick="appendValue('0')">0</button>
            <button id="equal" onclick="calculateResult()">=</button>
        </div>
    </div>

<script src="./assignment.js"></script>
</body>
</html>
